[project]
name = "aria-sidecar"
version = "0.1.0"
description = "ARIA sidecar — the brain. FastAPI + uvicorn, all state lives here."
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "ASYNC",
    "T20",  # flake8-print — CLAUDE.md rule 9: never print()
    "ANN",  # missing type annotations — CLAUDE.md rule 7
    "BLE",  # blind except — must be justified with a noqa
    "SLF",  # private member access
    "RUF",
]
ignore = [
    "ANN401",  # Any is occasionally correct at JSON-RPC boundaries
    "ANN101",  # deprecated: annotating `self` adds nothing
    "ANN102",  # deprecated: annotating `cls` adds nothing
    "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"sidecar/tests/*" = ["ANN201", "ANN001", "S101"]
# Developer CLIs, not the sidecar. Rule 9 bans print() because a running service
# must emit structured logs a user can grep at 2am; a report script printing its
# report to stdout is the opposite case. E402 covers the sys.path insert these
# need to import `sidecar` when run directly rather than as a module.
"scripts/*" = ["T201", "E402"]

[tool.mypy]
python_version = "3.11"
files = ["sidecar"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Neither ships type stubs or a py.typed marker.
module = [
    "sqlite_vec.*",
    "faster_whisper.*",
    "kokoro_onnx.*",
    "openwakeword.*",
    "comtypes.*",
    "pycaw.*",
    "psutil",
    "win32gui",
    "openpyxl",
    "docx",
    "pypdf",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests exercise loose shapes on purpose (malformed JSON, arbitrary params).
module = ["sidecar.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["sidecar/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:sidecar.*"]
